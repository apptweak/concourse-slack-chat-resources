name: Build and Push Images

on:
  # Allows other workflows (e.g., tag-release.yml) to call this workflow and pass a version
  workflow_call:
    inputs:
      version:
        description: Version tag (e.g., v1.2.3)
        required: true
        type: string
  # Enables manual triggering from the GitHub Actions UI with a version input
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g., v1.2.3)
        required: true
        type: string

# Publish to Ops ECR via GitHub OIDC → github-oidc-concourse-slack-chat-resources-ecr-push (no static AWS keys).
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::362072154386:role/github-oidc-concourse-slack-chat-resources-ecr-push
  ECR_REGISTRY: 362072154386.dkr.ecr.eu-west-1.amazonaws.com
  # Release publishes always refresh the stable moving tag (detached HEAD would otherwise yield "latest").
  IMAGE_TAG: stable

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ inputs.version != '' && inputs.version || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sync VERSION file with tag
        run: |
          TAG="${VERSION_TAG}"
          CLEAN_TAG="${TAG#v}"
          echo "${CLEAN_TAG}" > VERSION
          echo "Using VERSION=$(cat VERSION) (from tag ${TAG})"

      - name: Build and push images via Makefile
        run: make all
